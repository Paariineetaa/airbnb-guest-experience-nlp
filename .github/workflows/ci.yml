name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check src tests

      - name: Test
        # Runs against the committed sample in data/sample/, so CI needs no
        # download. spaCy's English model is not installed here; the lexicon
        # audit is not exercised by the test suite and falls back cleanly.
        run: pytest tests -q
